<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

  <!-- ── Navbar ── -->
  <nav class="navbar">
    <div class="logo">
      <div class="logo-icon"><div class="logo-play"></div></div>
      <span class="logo-text">Cine<span>Vault</span></span>
    </div>

    <ul class="nav-links">
      <li class="nav-link active" data-nav="popular">Em destaque</li>
      <li class="nav-link" data-nav="recent">Recentes</li>
      <li class="nav-link" data-nav="top">Mais votados</li>
      <li class="nav-link" data-nav="favs">Favoritos</li>
    </ul>

    <div class="nav-spacer"></div>

    <button class="nav-fav-btn" id="navFavBtn">
      <span>♥</span>
      <span>Favoritos</span>
      <span class="fav-badge" id="navFavBadge">0</span>
    </button>
  </nav>

  <!-- ── Hero / Search ── -->
  <header class="hero">
    <div class="hero-inner">    
      <h1 class="hero-title">Descobre<br><em>Cinema</em></h1>
      <p class="hero-sub">Pesquisa, explora e guarda os teus filmes favoritos. Acede a sinopses, elenco, classificações e trailers.</p>

      <search class="search-wrap">
        <div class="search-field">
          <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input class="search-input" id="searchInput" type="search" placeholder="Pesquisa filmes, atores…" autocomplete="off" spellcheck="false" aria-label="Pesquisar filmes"/>
          <button class="search-clear" id="searchClear" aria-label="Limpar pesquisa">✕</button>
        </div>
        <div class="autocomplete" id="autocomplete" role="listbox" aria-label="Sugestões"></div>
      </search>

      <div class="chips" id="genreContainer" role="group" aria-label="Filtrar por género"></div>
    </div>
  </header>

  <!-- ── Catálogo ── -->
  <main class="main">
    <section class="catalog" aria-labelledby="sectionTitle">
      <header class="section-header">
        <h2 class="section-title" id="sectionTitle">Filmes populares</h2>
        <span class="section-count" id="sectionCount"></span>
        <button class="section-action">ver todos →</button>
      </header>

      <div class="movie-grid" id="movieGrid" role="list"></div>
    </section>
  </main>

  <!-- ── Modal de detalhe ── -->
  <div class="modal-overlay" id="modalOverlay" aria-modal="true" role="dialog" aria-label="Detalhe do filme">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>

      <!-- backdrop -->
      <div class="modal-backdrop" id="modalBackdrop"></div>

      <div class="modal-body">
        <!-- coluna esquerda: poster -->
        <div class="modal-poster-col">
          <div class="modal-poster" id="modalPoster"></div>
          <button class="modal-fav-btn" id="modalFavBtn">
            <span id="modalFavIcon">♡</span>
            <span id="modalFavLabel">Adicionar aos favoritos</span>
          </button>
        </div>

        <!-- coluna direita: info -->
        <div class="modal-info-col">
          <div class="modal-genres" id="modalGenres"></div>
          <h2 class="modal-title" id="modalTitle"></h2>
          <div class="modal-meta" id="modalMeta"></div>
          <p class="modal-overview" id="modalOverview"></p>

          <div class="modal-cast-wrap" id="modalCastWrap">
            <div class="modal-cast-label">Elenco principal</div>
            <div class="modal-cast" id="modalCast"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/script.js"></script>
</body>
</html>
